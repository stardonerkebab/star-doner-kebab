<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Doner Kebab — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#D85A30;--gold:#EF9F27;--cream:#FAF7F2;--dark:#2C2C2A;--mid:#5F5E5A;--green:#1D9E75}
body{font-family:'Lato',sans-serif;background:#0f0f0f;color:#fff;min-height:100vh}
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.login-box{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:2rem;width:100%;max-width:380px}
.login-box h1{font-family:'Playfair Display',serif;color:var(--gold);font-size:1.6rem;margin-bottom:.3rem;text-align:center}
.login-box p{color:#888;font-size:.85rem;text-align:center;margin-bottom:1.5rem}
.fgroup{margin-bottom:1rem}
.fgroup label{display:block;font-size:.72rem;font-weight:700;color:#888;margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.5px}
.fgroup input{width:100%;padding:.8rem 1rem;background:#111;border:1px solid #333;border-radius:8px;color:#fff;font-family:'Lato',sans-serif;font-size:.9rem}
.fgroup input:focus{outline:none;border-color:var(--gold)}
.login-btn{width:100%;background:var(--red);color:#fff;border:none;border-radius:8px;padding:1rem;font-size:.95rem;font-weight:700;cursor:pointer;font-family:'Lato',sans-serif;margin-top:.5rem}
.err{background:rgba(216,90,48,.15);border:1px solid var(--red);color:#ff9980;border-radius:6px;padding:.6rem 1rem;font-size:.82rem;margin-top:.8rem;display:none}

.dashboard{display:none;min-height:100vh;flex-direction:column}
.dash-nav{background:#1a1a1a;border-bottom:1px solid #333;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.dash-logo{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--gold)}
.online-dot{display:inline-flex;align-items:center;gap:.5rem;font-size:.82rem;color:#1D9E75}
.online-dot::before{content:'';width:8px;height:8px;border-radius:50%;background:#1D9E75;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.logout-btn{background:none;border:1px solid #444;color:#888;padding:.4rem .9rem;border-radius:6px;cursor:pointer;font-size:.8rem;font-family:'Lato',sans-serif}

.dash-body{padding:1.5rem;max-width:1100px;margin:0 auto;width:100%}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem}
.stat-card{background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:1rem 1.2rem}
.stat-num{font-size:2rem;font-weight:700;margin-bottom:.2rem}
.stat-label{font-size:.75rem;color:#888;text-transform:uppercase;letter-spacing:.5px}

.orders-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
.col-header{font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:.8rem;padding-bottom:.5rem;border-bottom:1px solid #333}
.order-card{background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:1.1rem;margin-bottom:.8rem;transition:border-color .2s}
.order-card:hover{border-color:#555}
.order-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
.order-id{font-size:.75rem;font-family:monospace;color:#888}
.order-time{font-size:.72rem;color:#666}
.client-info{margin-bottom:.6rem}
.client-name{font-size:.92rem;font-weight:700;color:#fff}
.client-num{display:inline-block;background:var(--gold);color:#1a1a1a;font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:6px}
.client-phone{font-size:.78rem;color:#888;margin-top:.15rem}
.order-items{font-size:.82rem;color:#ccc;margin-bottom:.7rem;line-height:1.9;word-break:break-word}
.order-custom{font-size:.75rem;color:#EF9F27;margin-left:.8rem;line-height:1.6;display:block;margin-top:.1rem}
.order-total{font-size:.95rem;font-weight:700;color:var(--red);margin-bottom:.7rem}
.order-notes{background:#111;border-radius:5px;padding:.4rem .6rem;font-size:.75rem;color:#aaa;margin-bottom:.7rem}

.action-row{display:flex;gap:.5rem;flex-wrap:wrap}
.time-input{flex:1;min-width:80px;background:#111;border:1px solid #444;border-radius:5px;padding:.4rem .6rem;color:#fff;font-size:.8rem;font-family:'Lato',sans-serif}
.time-input::placeholder{color:#555}
.confirm-btn{background:var(--green);color:#fff;border:none;border-radius:5px;padding:.4rem .8rem;font-size:.78rem;font-weight:700;cursor:pointer;font-family:'Lato',sans-serif;white-space:nowrap}
.ready-btn{background:var(--gold);color:#1a1a1a;border:none;border-radius:5px;padding:.4rem .8rem;font-size:.78rem;font-weight:700;cursor:pointer;font-family:'Lato',sans-serif}

.empty-col{text-align:center;padding:2rem;color:#555;font-size:.85rem}
.notif-bar{position:fixed;top:0;left:0;right:0;background:var(--green);color:#fff;padding:.8rem 2rem;text-align:center;font-weight:700;font-size:.9rem;transform:translateY(-100%);transition:transform .3s;z-index:200}
.notif-bar.show{transform:translateY(0)}

@media(max-width:900px){
  .orders-grid{grid-template-columns:1fr}
  .stats-row{grid-template-columns:1fr 1fr}
}
@media(max-width:500px){.stats-row{grid-template-columns:1fr 1fr}}

.print-btn{background:#555;color:#fff;border:none;border-radius:5px;padding:.35rem .7rem;font-size:.75rem;font-weight:700;cursor:pointer;font-family:'Lato',sans-serif;margin-left:.4rem}
.print-btn:hover{background:#777}

@media print {
  body{background:#fff!important;color:#000!important}
  .dash-nav,.stats-row,.action-row,.print-btn,
  .notif-bar,.orders-grid > div:nth-child(1),
  .orders-grid > div:nth-child(3){display:none!important}
  .orders-grid{grid-template-columns:1fr!important}
  .order-card{background:#fff!important;border:1px solid #ccc!important;
    color:#000!important;break-inside:avoid;margin-bottom:1rem}
  .client-name,.client-num{color:#000!important}
  .order-items{color:#000!important}
  .order-total{color:#D85A30!important}
  .order-card-header span{color:#666!important}
}
</style>
</head>
<body>

<div class="notif-bar" id="notifBar">🔔 Nuevo pedido recibido!</div>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>⭐ Star Doner Kebab</h1>
    <p>Panel del Restaurante</p>
    <div class="fgroup">
      <label>Email del restaurante</label>
      <input type="email" id="dash-email" placeholder="restaurante@email.com">
    </div>
    <div class="fgroup">
      <label>Contraseña</label>
      <input type="password" id="dash-password" placeholder="••••••••">
    </div>
    <button class="login-btn" onclick="dashLogin()">Entrar al Panel →</button>
    <div class="err" id="dash-err"></div>
    <p style="font-size:.75rem;color:#555;text-align:center;margin-top:1rem">Solo para uso del restaurante</p>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboardScreen">
  <div class="dash-nav">
    <div class="dash-logo">⭐ Star Doner Kebab — Panel</div>
    <div style="display:flex;align-items:center;gap:1.5rem">
      <div class="online-dot">En línea</div>
      <button class="logout-btn" onclick="dashLogout()">Salir</button>
    </div>
  </div>

  <div class="dash-body">
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="statPending" style="color:var(--gold)">0</div><div class="stat-label">Pendientes</div></div>
      <div class="stat-card"><div class="stat-num" id="statConfirmed" style="color:var(--green)">0</div><div class="stat-label">Confirmados</div></div>
      <div class="stat-card"><div class="stat-num" id="statReady" style="color:#888">0</div><div class="stat-label">Listos</div></div>
      <div class="stat-card"><div class="stat-num" id="statTotal" style="color:var(--red)">0 €</div><div class="stat-label">Total hoy</div></div>
    </div>

    <div class="orders-grid">
      <div>
        <div class="col-header">⏳ Pendientes</div>
        <div id="col-pending"></div>
      </div>
      <div>
        <div class="col-header">✅ Confirmados</div>
        <div id="col-confirmed"></div>
      </div>
      <div>
        <div class="col-header">🎉 Listos para recoger</div>
        <div id="col-ready"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD7oZ5voHdb-lgShUToEqcOQAJTcSxhMQA",
  authDomain: "star-doner-kebab-9b465.firebaseapp.com",
  projectId: "star-doner-kebab-9b465",
  storageBucket: "star-doner-kebab-9b465.firebasestorage.app",
  messagingSenderId: "178986380987",
  appId: "1:178986380987:web:dbcefe3444ead72f68039e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let allOrders = [];
let prevOrderCount = 0;

onAuthStateChanged(auth, user => {
  if (user) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboardScreen').style.display = 'flex';
    document.getElementById('dashboardScreen').style.flexDirection = 'column';
    listenToOrders();
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('dashboardScreen').style.display = 'none';
  }
});

window.dashLogin = async function() {
  const email = document.getElementById('dash-email').value.trim();
  const pass = document.getElementById('dash-password').value;
  const err = document.getElementById('dash-err');
  err.style.display = 'none';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    err.textContent = 'Email o contraseña incorrectos.';
    err.style.display = 'block';
  }
};

window.dashLogout = async function() {
  await signOut(auth);
};

function listenToOrders() {
  const today = new Date();
  today.setHours(0,0,0,0);
  const q = query(collection(db, 'orders'), orderBy('createdAt','desc'));
  onSnapshot(q, snap => {
    allOrders = snap.docs.map(d => ({id: d.id, ...d.data()}));

    // Notification for new orders
    const pendingCount = allOrders.filter(o => o.status === 'pending').length;
    if (pendingCount > prevOrderCount && prevOrderCount >= 0) {
      showNotif();
      playBeep();
    }
    prevOrderCount = pendingCount;
    renderOrders();
    updateStats();
  });
}

function showNotif() {
  const bar = document.getElementById('notifBar');
  bar.classList.add('show');
  setTimeout(() => bar.classList.remove('show'), 4000);
}

function playBeep() {
  try {
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    osc.connect(ctx.destination);
    osc.frequency.value = 880;
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  } catch(e) {}
}

function updateStats() {
  const pending = allOrders.filter(o => ['pending','rejected_time','awaiting_confirmation'].includes(o.status)).length;
  const confirmed = allOrders.filter(o => o.status === 'confirmed').length;
  const ready = allOrders.filter(o => o.status === 'ready').length;
  const total = allOrders.filter(o => o.status !== 'cancelled')
    .reduce((s, o) => s + (o.total || 0), 0);
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statConfirmed').textContent = confirmed;
  document.getElementById('statReady').textContent = ready;
  document.getElementById('statTotal').textContent = total.toFixed(2) + ' €';
}

function renderOrders() {
  const pending   = allOrders.filter(o => o.status === 'pending');
  const awaiting  = allOrders.filter(o => o.status === 'awaiting_confirmation');
  const rejected  = allOrders.filter(o => o.status === 'rejected_time');
  const confirmed = allOrders.filter(o => o.status === 'confirmed');
  const ready     = allOrders.filter(o => o.status === 'ready');

  // Col 1: pending + rejected (need action)
  const cancelled = allOrders.filter(o => o.status === 'cancelled');
  const col1 = [...pending, ...rejected, ...awaiting];
  document.getElementById('col-pending').innerHTML = col1.length
    ? col1.map(o => orderCard(o, o.status)).join('')
    : '<div class="empty-col">Sin pedidos pendientes</div>';

  document.getElementById('col-confirmed').innerHTML = confirmed.length
    ? confirmed.map(o => orderCard(o, 'confirmed')).join('')
    : '<div class="empty-col">Sin pedidos confirmados</div>';

  document.getElementById('col-ready').innerHTML = ready.length
    ? ready.map(o => orderCard(o, 'ready')).join('')
    : '<div class="empty-col">Sin pedidos listos</div>';
}

function orderCard(o, status) {
  const time = o.createdAt?.toDate ? o.createdAt.toDate().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'}) : '';
  const items = (o.items || []).map(i => {
    let line = `<div style="margin-bottom:.6rem;background:#222;border-radius:6px;padding:.5rem .7rem">`;
    line += `<div style="margin-bottom:.3rem">🥙 <strong style="color:#fff;font-size:.88rem">${i.qty}x ${i.name}</strong>`;
    if (i.variant) line += ` <span style="color:#EF9F27;font-size:.8rem">— ${i.variant}</span>`;
    line += `</div>`;
    if (i.custom && i.custom.trim()) {
      const parts = i.custom.split('.').filter(p => p.trim());
      parts.forEach(part => {
        const p = part.trim();
        if (!p) return;
        let icon = '📝';
        if (p.startsWith('Carne:')) icon = '🥩';
        else if (p.startsWith('Sin:')) icon = '❌';
        else if (p.startsWith('Con:')) icon = '✅';
        else if (p.startsWith('Salsa')) icon = '🥫';
        else if (p.startsWith('Extra carne')) icon = '🥩➕';
        else if (p.startsWith('Extra queso')) icon = '🧀';
        else if (p.startsWith('Carne sobre patatas')) icon = '🍟🥩';
        line += `<div style="font-size:.78rem;color:#ccc;padding:.1rem 0">${icon} ${p}</div>`;
      });
    } else {
      // No customisation — show standard ingredients
      line += `<div style="font-size:.75rem;color:#666;font-style:italic">Sin personalización — ingredientes estándar</div>`;
    }
    line += `</div>`;
    return line;
  }).join('');
  const notes = o.notes ? `<div class="order-notes">📝 ${o.notes}</div>` : '';
  
  let actions = '';
  let statusTag = '';
  if (status === 'pending') {
    actions = `<div class="action-row">
      <input class="time-input" id="time-${o.id}" placeholder="14:30" maxlength="5"
  oninput="let v=this.value.replace(/[^0-9]/g,'');if(v.length>=3){v=v.slice(0,2)+':'+v.slice(2,4);}this.value=v;">
      <button class="confirm-btn" onclick="confirmOrder('${o.id}')">✅ Proponer hora</button>
      <button onclick="cancelOrderDash('${o.id}')" style="background:#E24B4A;color:#fff;border:none;border-radius:5px;padding:.4rem .7rem;font-size:.75rem;font-weight:700;cursor:pointer;font-family:'Lato',sans-serif">✕ Cancelar</button>
    </div>`;
  } else if (status === 'awaiting_confirmation') {
    statusTag = `<div style="background:#FFF3CD;color:#856404;border-radius:5px;padding:4px 8px;font-size:.75rem;font-weight:700;margin-bottom:.5rem">⏳ Esperando que el cliente acepte la hora: ${o.pickupTime}</div>`;
    actions = `<div class="action-row"><button onclick="cancelOrderDash('${o.id}')" style="background:#E24B4A;color:#fff;border:none;border-radius:5px;padding:.4rem .7rem;font-size:.75rem;font-weight:700;cursor:pointer;font-family:'Lato',sans-serif">✕ Cancelar pedido</button></div>`;
  } else if (status === 'rejected_time') {
    const suggested = o.clientSuggestedTime ? ` · Cliente propone: <strong>${o.clientSuggestedTime}</strong>` : '';
    statusTag = `<div style="background:#ffeeee;color:#E24B4A;border-radius:5px;padding:4px 8px;font-size:.75rem;font-weight:700;margin-bottom:.5rem">❌ Cliente rechazó la hora${suggested}</div>`;
    actions = `<div class="action-row">
      <input class="time-input" id="time-${o.id}" placeholder="14:30" maxlength="5"
  oninput="let v=this.value.replace(/[^0-9]/g,'');if(v.length>=3){v=v.slice(0,2)+':'+v.slice(2,4);}this.value=v;">
      <button class="confirm-btn" onclick="confirmOrder('${o.id}')">🔄 Nueva hora</button>
    </div>`;
  } else if (status === 'confirmed') {
    actions = `<div class="action-row">
      <button class="ready-btn" onclick="markReady('${o.id}')">🎉 Marcar Listo</button>
    </div>`;
  } else {
    actions = `<div style="font-size:.78rem;color:var(--green);font-weight:700">✅ Recogido</div>`;
  }

  return `<div class="order-card">
    <div class="order-card-header">
      <span class="order-id">#${o.id.slice(-6).toUpperCase()}</span>
      <div style="display:flex;align-items:center;gap:.4rem">
        <span class="order-time">${time}</span>
        <button class="print-btn" onclick="printOrder('${o.id}')">🖨️</button>
      </div>
    </div>
    <div class="client-info">
      <span class="client-name">${o.clientName || 'Cliente'}</span>
      <span class="client-num">${o.clientNumber || ''}</span>
      <div class="client-phone">📞 ${o.clientPhone || ''}</div>
    </div>
    <div class="order-items">${items}</div>
    <div class="order-total">Total: ${(o.total||0).toFixed(2)} €</div>
    ${notes}
    ${statusTag}
    ${actions}
  </div>`;
}

window.confirmOrder = async function(orderId) {
  const timeInput = document.getElementById('time-' + orderId);
  const pickupTime = timeInput ? timeInput.value.trim() : '';
  if (!pickupTime) {
    alert('Por favor introduce la hora de recogida (ej: 14:30)');
    return;
  }
  // Set to awaiting_confirmation — client must accept the time
  await updateDoc(doc(db, 'orders', orderId), {
    status: 'awaiting_confirmation',
    pickupTime: pickupTime
  });
};

window.markReady = async function(orderId) {
  await updateDoc(doc(db, 'orders', orderId), { status: 'ready' });
};

window.printOrder = function(orderId) {
  const order = allOrders.find(o => o.id === orderId);
  if (!order) return;
  const time = order.createdAt?.toDate ? order.createdAt.toDate().toLocaleString('es-ES') : '';
  const items = (order.items || []).map(i => {
    let line = `<div style="margin-bottom:8px;padding:6px;background:#f9f9f9;border-radius:4px">`;
    line += `<strong>${i.qty}x ${i.name}</strong>`;
    if (i.variant) line += ` — ${i.variant}`;
    if (i.custom && i.custom.trim()) {
      const parts = i.custom.split('.').filter(p => p.trim());
      parts.forEach(p => {
        if (p.trim()) line += `<br><span style="font-size:12px;color:#555">📝 ${p.trim()}</span>`;
      });
    } else {
      line += `<br><span style="font-size:12px;color:#999">Ingredientes estándar</span>`;
    }
    line += `</div>`;
    return line;
  }).join('');

  const notes = order.notes ? `<div style="background:#fff9ee;border:1px solid #EF9F27;border-radius:4px;padding:8px;margin-top:8px"><strong>📝 Notas:</strong> ${order.notes}</div>` : '';

  const win = window.open('', '_blank', 'width=400,height=600');
  win.document.write(`
    <!DOCTYPE html><html><head>
    <meta charset="UTF-8">
    <title>Pedido #${order.id.slice(-6).toUpperCase()}</title>
    <style>
      body{font-family:Arial,sans-serif;padding:20px;max-width:380px;margin:0 auto}
      h2{text-align:center;color:#D85A30;margin-bottom:4px}
      .header{text-align:center;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:12px}
      .client{background:#f0f0f0;padding:8px;border-radius:4px;margin-bottom:12px}
      .total{font-size:1.2rem;font-weight:bold;color:#D85A30;text-align:right;
             border-top:2px solid #000;padding-top:8px;margin-top:8px}
      .footer{text-align:center;font-size:11px;color:#888;margin-top:16px;border-top:1px solid #ccc;padding-top:8px}
      @media print{button{display:none}}
    </style>
    </head><body>
    <div class="header">
      <h2>⭐ Star Doner Kebab</h2>
      <div style="font-size:12px;color:#666">Av. de Colón, 110 · Cartagena</div>
      <div style="font-size:13px;margin-top:4px"><strong>Pedido #${order.id.slice(-6).toUpperCase()}</strong> · ${time}</div>
    </div>
    <div class="client">
      <strong>${order.clientName || 'Cliente'}</strong>
      <span style="background:#EF9F27;color:#000;font-size:11px;font-weight:bold;padding:2px 7px;border-radius:20px;margin-left:6px">${order.clientNumber || ''}</span><br>
      📞 ${order.clientPhone || ''}
    </div>
    <div>${items}</div>
    ${notes}
    <div class="total">Total: ${(order.total || 0).toFixed(2)} €</div>
    ${order.pickupTime ? `<div style="text-align:center;margin-top:8px;font-size:14px">🕐 Hora recogida: <strong>${order.pickupTime}</strong></div>` : ''}
    <div class="footer">Star Doner Kebab · 968 16 87 47</div>
    <br>
    <button onclick="window.print()" style="width:100%;padding:10px;background:#D85A30;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer">🖨️ Imprimir</button>
    </body></html>
  `);
  win.document.close();
};

window.cancelOrderDash = async function(orderId) {
  if (!confirm('¿Cancelar este pedido?')) return;
  await updateDoc(doc(db, 'orders', orderId), { status: 'cancelled' });
};
</script>
</body>
</html>
